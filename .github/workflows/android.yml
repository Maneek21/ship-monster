name: Android build

on:
  push:
    paths:
      - "android/**"
      - "ci/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Unit tests and debug APK
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain testDebugUnitTest assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Puts the important lines of a failed build into an annotation, so the cause is readable without opening the full log.
      - name: Show what failed
        if: failure()
        run: |
          touch "$RUNNER_TEMP/errs.txt"
          grep -E "^e: |error:|FAILED|What went wrong|^> |Unresolved|AAPT|Could not|Exception" "$RUNNER_TEMP/build.log" | head -n 60 >> "$RUNNER_TEMP/errs.txt" || true
          grep -h -o 'failure message="[^"]*"' android/app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | head -n 20 >> "$RUNNER_TEMP/errs.txt" || true
          MSG=$(sed 's/%/%25/g' "$RUNNER_TEMP/errs.txt" | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build failed::${MSG}"

      - name: Keep the APK with the run
        uses: actions/upload-artifact@v4
        with:
          name: ship-monster-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Advisory. Lint findings are printed for review and never fail the build.
      - name: Android lint
        continue-on-error: true
        working-directory: android
        run: |
          gradle --no-daemon --console=plain lintDebug > "$RUNNER_TEMP/lint.log" 2>&1 || true
          echo "@@LINT BEGIN"
          cat app/build/reports/lint-results-debug.txt 2>/dev/null || tail -n 40 "$RUNNER_TEMP/lint.log"
          echo "@@LINT END"

      # One prerelease, overwritten on every green build, so there is always a stable link to the newest APK.
      - name: Publish rolling debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=debug-latest
          cp android/app/build/outputs/apk/debug/app-debug.apk ship-monster-debug.apk
          NOTES="Rolling debug build. Branch ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}, run ${GITHUB_RUN_NUMBER}. A debug build for testing, not a release."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ship-monster-debug.apk --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" ship-monster-debug.apk --prerelease --title "Latest debug build" --notes "$NOTES" --target "$GITHUB_SHA"
          fi

  # Installs the APK on real Android emulators and drives the main flows: sync, lock, mercy unlock, widget, share, reboot.
  device-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ship-monster-debug
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pillow, for shrinking screenshots
        run: python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 ci/device_test.py apk/app-debug.apk
